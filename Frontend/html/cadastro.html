<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#102A40">
    <title>Criar conta • Rota Fácil</title>
    <link rel="icon" href="../assets/favicon-rota-facil.png">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pagina-acesso">
    <div class="aplicativo">
        <header class="topo-acesso">
            <img src="../assets/logo-rota-facil.png" alt="Rota Fácil">
        </header>

        <main>
            <h1>Seu espaço começa aqui</h1>
            <p class="introducao">Crie sua conta para gerenciar seus veículos, clientes e recebimentos.</p>
            <form action="login.html">
                <label>
                    Nome completo
                    <input type="text" placeholder="Digite seu nome">
                </label>
                <label>
                    CPF
                    <input type="text" placeholder="000.000.000-00">
                </label>
                <label>
                    Seu WhatsApp
                    <input type="tel" placeholder="(84) 99999-9999">
                </label>
                <label>
                    E-mail
                    <input type="email" placeholder="seuemail@gmail.com">
                </label>
                <label>
                    Cidade e estado
                    <input type="text" placeholder="São Miguel, RN">
                </label>
                <label>
                    Senha · mínimo 8 caracteres
                    <input type="password" placeholder="Digite sua senha">
                </label>
                <label>
                    Confirme sua senha
                    <input type="password" placeholder="Digite sua senha novamente">
                </label>
                <button class="botao" type="submit">Criar meu espaço</button>
            </form>

            <p class="observacao-acesso">Já tem conta? <a href="login.html">Entrar</a></p>
        </main>
    </div>
</body>
</html>
