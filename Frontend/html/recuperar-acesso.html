<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#102A40">
    <title>Recuperar acesso • Rota Fácil</title>
    <link rel="icon" href="../assets/favicon-rota-facil.png">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pagina-acesso">
    <div class="aplicativo">
        <header class="topo-acesso">
            <img src="../assets/logo-rota-facil.png" alt="Rota Fácil">
        </header>

        <main>
            <h1>Recuperar acesso</h1>
            <p class="introducao">Informe seu e-mail cadastrado para receber um link de recuperação de senha.</p>
            <form action="login.html">
                <label>
                    E-mail cadastrado
                    <input type="email" placeholder="Digite seu e-mail">
                </label>
                <button class="botao" type="submit">Enviar link de recuperação</button>
            </form>

            <a class="link-acesso" href="login.html">Voltar ao login</a>
        </main>
    </div>
</body>
</html>
