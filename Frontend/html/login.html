<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#102A40">
    <title>Entrar • Rota Fácil</title>
    <link rel="icon" href="../assets/favicon-rota-facil.png">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pagina-acesso">
    <div class="aplicativo">
        <header class="topo-acesso">
            <img src="../assets/logo-rota-facil.png" alt="Rota Fácil">
        </header>

        <main>
            <span class="selo">ESPAÇO DO MOTORISTA</span>
            <h1>Seu dia na direção</h1>
            <p class="introducao">Entre para cuidar das viagens e receba com tranquilidade.</p>
            <form action="index.html">
                <label>
                    Login ou e-mail
                    <input type="email" placeholder="Seu login ou e-mail">
                </label>
                <label>
                    Senha
                    <input type="password" placeholder="Digite sua senha">
                </label>
                <a class="link-acesso recuperar-senha" href="recuperar-acesso.html">Esqueci minha senha</a>
                <button class="botao" type="submit">Entrar no meu painel</button>
            </form>

            <p class="observacao-acesso">Primeira vez aqui? <a href="cadastro.html">Criar conta de motorista</a></p>
        </main>
    </div>
</body>
</html>
